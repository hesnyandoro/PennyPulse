<VirtualHost *:80>
    ServerAdmin admin@example.com
    DocumentRoot /var/www/html

    DirectoryIndex index.php index.html

    # Enable URL rewriting
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite engine for routing (if using a router)
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule \.(env|json|lock|md|yml|yaml|git)$ - [F,L]  # Block access to sensitive files
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ /index.php/$1 [L]
        </IfModule>
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "no-referrer-when-downgrade"
    </IfModule>

    # Disable access to sensitive files
    <FilesMatch "\.(env|json|lock|md|yml|yaml|git)$">
        Require all denied
    </FilesMatch>

    <Directory /var/www/html/uploads>
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Logging (piped to stdout/stderr for Docker)
    # Override global ErrorLog with absolute path to application logs
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # Performance settings
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript
        DeflateCompressionLevel 6
    </IfModule>

    # Caching headers
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 2 days"
        ExpiresByType text/html "access plus 2 hours"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>
</VirtualHost>

